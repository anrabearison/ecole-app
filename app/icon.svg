<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Shield -->
  <path d="M256 64 L384 112 V256 C384 340 328 412 256 448 C184 412 128 340 128 256 V112 L256 64 Z" 
        stroke="url(#iconGrad)" stroke-width="16" stroke-linejoin="round" fill="none" opacity="0.4" />

  <!-- Inner Shield Glow -->
  <path d="M256 88 L360 128 V248 C360 320 312 384 256 416 C200 384 152 320 152 248 V128 L256 88 Z" 
        stroke="url(#iconGrad)" stroke-width="12" stroke-linejoin="round" fill="none" filter="url(#glow)" />

  <!-- Graduation Cap / Book Icon -->
  <g transform="translate(0, 10)">
    <!-- Diamond Top -->
    <path d="M256 160 L360 210 L256 260 L152 210 Z" 
          fill="url(#iconGrad)" stroke="#10B981" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Cap Neck / Base -->
    <path d="M192 235 V280 C192 295 220 310 256 310 C292 310 320 295 320 280 V235" 
          stroke="url(#iconGrad)" stroke-width="14" stroke-linecap="round" fill="none" />
    
    <!-- Tassel -->
    <path d="M330 225 V285 C330 295 338 300 338 300" 
          stroke="#10B981" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="338" cy="304" r="7" fill="#10B981" />

    <!-- Open Book Base -->
    <path d="M160 340 Q256 320 256 370 Q256 320 352 340 V380 Q256 360 256 400 Q256 360 160 380 Z" 
          fill="url(#iconGrad)" opacity="0.9" />
  </g>
</svg>
